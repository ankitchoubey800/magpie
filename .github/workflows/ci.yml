# Runs on every push and pull request: build everything, run every test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Magpie.slnx
      - run: dotnet build Magpie.slnx --configuration Release --no-restore
      - run: dotnet test Magpie.slnx --configuration Release --no-build

  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    name: Whole system in Docker Compose
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v5
      - name: Create the local settings file
        # The tests below make far more than 10 sign-in requests a minute from
        # one address, so CI raises the limit. A later step lowers it again to
        # prove the limit works.
        run: |
          cp infra/.env.example infra/.env
          sed -i 's/^AUTH_REQUESTS_PER_MINUTE=.*/AUTH_REQUESTS_PER_MINUTE=1000/' infra/.env
      - name: Start everything
        # No "--wait" here: the one-off migration container exits on purpose,
        # and the retries in the next step do the waiting.
        run: docker compose up --build --detach
      - name: One request travels gateway -> accounts -> PostgreSQL
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/api/accounts/ping
      - name: The gateway serves the website
        run: curl --fail --silent --show-error http://localhost:8080/ | grep --quiet '<div id="root">'
      - name: Accounts reports ready
        run: curl --fail --silent --show-error http://localhost:5101/health/ready
      - name: Who-am-I without a session is refused
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/accounts/me)" = "401"
      - name: Full journey - register, confirm from the email, sign in, who-am-I, sign out
        run: python3 infra/smoke/auth_flow.py
      - name: A session survives a restart of the Accounts service
        run: |
          cookie=$(python3 infra/smoke/auth_flow.py http://localhost:8080 http://localhost:8025 --keep-session | sed -n 's/^SESSION_COOKIE=//p')
          docker compose restart accounts
          for attempt in $(seq 1 15); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Cookie: magpie.session=$cookie" http://localhost:8080/api/accounts/me)
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          echo "who-am-I with the old cookie after restart: HTTP $status"
          test "$status" = "200"
      - name: TEMP stress
        run: python3 infra/smoke/_tmp_stress.py; docker compose logs accounts --no-color --tail 60 | grep -E 'Warning|Error' | cut -c1-900 | tail -8 || true
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser tests (Playwright, real Chromium)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Show Accounts logs if the browser tests failed
        if: failure()
        run: docker compose logs accounts --no-color --tail 200
      - name: Restart Accounts with the real rate limit and a placeholder Google client
        run: |
          AUTH_REQUESTS_PER_MINUTE=10 GOOGLE_CLIENT_ID=ci-placeholder GOOGLE_CLIENT_SECRET=ci-placeholder \
            docker compose up --detach accounts
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors \
            http://localhost:5101/health/ready
      - name: Continue-with-Google sends the browser to Google with OUR public address
        run: |
          target=$(curl --silent --output /dev/null --write-out '%{redirect_url}' \
            http://localhost:8080/api/accounts/external/Google/start)
          echo "$target" | sed 's/state=[^&]*/state=.../'
          echo "$target" | grep --quiet '^https://accounts.google.com/'
          echo "$target" | grep --quiet 'redirect_uri=http%3A%2F%2Flocalhost%3A8080%2Fapi%2Faccounts%2Fexternal%2Fgoogle%2Fsignin'
      - name: Break it - guess passwords fast
        run: |
          python3 infra/smoke/guess_passwords.py 30 | tee guess.txt
          email=$(sed -n 's/^GUESS_EMAIL=//p' guess.txt)
          docker compose exec -T postgres psql -U magpie -d magpie_accounts -c \
            "SELECT \"AccessFailedCount\" AS failed_count, \"LockoutEnd\" IS NOT NULL AS locked FROM users WHERE \"Email\" = '$email';"
          grep --quiet 'first 429 at guess number: 9' guess.txt
      - name: Break it - stop PostgreSQL
        run: |
          show() { echo "--- $1"; curl --silent --max-time 20 --write-out '\nHTTP %{http_code} %{content_type}\n' "$1" || true; }
          docker compose stop postgres
          show http://localhost:8080/api/accounts/ping
          show http://localhost:5101/health/live
          show http://localhost:5101/health/ready
          show http://localhost:8080/health/ready
          test "$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/accounts/ping)" = "503"
          test "$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' http://localhost:5101/health/live)" = "200"
          test "$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' http://localhost:5101/health/ready)" = "503"
      - name: Recover - start PostgreSQL again
        run: |
          docker compose start postgres
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/api/accounts/ping
      - name: Break it - stop the Accounts service
        run: |
          docker compose stop accounts
          echo "--- ping through the gateway while accounts is stopped"
          curl --silent --max-time 20 --write-out '\nHTTP %{http_code} %{content_type}\n' http://localhost:8080/api/accounts/ping || true
          test "$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' http://localhost:8080/)" = "200"
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail 40
      - name: Stop everything
        if: always()
        run: docker compose down --volumes
