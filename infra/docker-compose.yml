# The whole laptop environment.
#   Start:  docker compose -f infra/docker-compose.yml up --build
#   Stop:   docker compose -f infra/docker-compose.yml down
#   Open:   http://localhost:8080      (the website)
#           http://localhost:8025      (Mailpit: every email the system "sends")
#           http://localhost:5102/health/ready   (the collector, which has no pages)
# Values written as ${NAME} come from infra/.env (see infra/.env.example).

name: magpie

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql
      # (older guides say /var/lib/postgresql/data; that path is wrong for 18).
      - postgres-data:/var/lib/postgresql
    ports:
      # Reachable from your laptop only (127.0.0.1), for tools such as psql.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email instead of delivering it. Nothing leaves your laptop.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"   # inbox in your browser
      - "127.0.0.1:1025:1025"   # SMTP, for when you run Accounts with "dotnet run"

  # One-off job: bring the database tables up to date, then exit.
  # It uses the same image as the Accounts service, started with "--migrate".
  accounts-migrate:
    image: magpie-accounts
    build:
      context: ..
      dockerfile: src/services/accounts/Dockerfile
    command: ["--migrate"]
    environment:
      ConnectionStrings__AccountsDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=30"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  accounts:
    image: magpie-accounts
    build:
      context: ..
      dockerfile: src/services/accounts/Dockerfile
    environment:
      # Two underscores stand for ":" in .NET configuration names,
      # so this sets ConnectionStrings:AccountsDb.
      ConnectionStrings__AccountsDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=5"
      # The address readers type in their browser. Used for links in emails.
      Accounts__PublicBaseUrl: "http://localhost:8080"
      Accounts__DataProtectionKeysPath: "/keys"
      # How many sign-up/sign-in/reset requests one network address may make per minute.
      Accounts__AuthRequestsPerMinute: "${AUTH_REQUESTS_PER_MINUTE:-10}"
      # Leave both empty to switch "Continue with Google" off.
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Email__Host: "mailpit"
      Email__Port: "1025"
    volumes:
      # Without this volume every restart would create new keys,
      # and every reader would be signed out.
      - accounts-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      accounts-migrate:
        # Start only after the tables exist.
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      # Laptop-only shortcut so you can call the service's health endpoints
      # directly during experiments. Removed in week 17, when the gateway
      # becomes the only way in.
      - "127.0.0.1:5101:8080"

  # One-off job: create the collector's own database and tables, then add the
  # sources from the seed file that are not there yet. Safe to run every time.
  collector-migrate:
    image: magpie-collector
    build:
      context: ..
      dockerfile: src/services/collector/Dockerfile
    command: ["--migrate", "--seed-sources", "/seed/sources.json"]
    environment:
      ConnectionStrings__CollectorDb: "Host=postgres;Port=5432;Database=magpie_collector;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=30"
    volumes:
      - ${COLLECTOR_SEED_FILE:-./seed/sources.json}:/seed/sources.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The collector has no route in the gateway: nothing outside ever calls it.
  collector:
    image: magpie-collector
    build:
      context: ..
      dockerfile: src/services/collector/Dockerfile
    environment:
      # A separate DATABASE on the same server. Each service owns its own data.
      ConnectionStrings__CollectorDb: "Host=postgres;Port=5432;Database=magpie_collector;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=10"
      Collector__ContactUrl: "${COLLECTOR_CONTACT_URL}"
      Collector__TickSeconds: "${COLLECTOR_TICK_SECONDS:-30}"
      Collector__PerSourceTimeoutSeconds: "${COLLECTOR_PER_SOURCE_TIMEOUT_SECONDS:-20}"
      Collector__HttpTimeoutSeconds: "${COLLECTOR_HTTP_TIMEOUT_SECONDS:-8}"
    depends_on:
      postgres:
        condition: service_healthy
      collector-migrate:
        condition: service_completed_successfully
    extra_hosts:
      # Lets the container reach a program on your own machine (used by the
      # week 5 experiment). Docker Desktop provides this name by itself;
      # on Linux this line is what makes it exist.
      - "host.docker.internal:host-gateway"
    ports:
      # Laptop-only, for its health endpoints.
      - "127.0.0.1:5102:8080"

  web:
    build:
      context: ../src/web

  gateway:
    build:
      context: ..
      dockerfile: src/gateway/Dockerfile
    environment:
      # Inside Docker, containers find each other by service name.
      ReverseProxy__Clusters__accounts__Destinations__primary__Address: "http://accounts:8080/"
      ReverseProxy__Clusters__web__Destinations__primary__Address: "http://web:8080/"
    depends_on:
      - accounts
      - web
    ports:
      # The ONE address a browser uses.
      - "8080:8080"

volumes:
  postgres-data:
  accounts-keys:
