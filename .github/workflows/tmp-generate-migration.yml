name: tmp-generate-migration
on:
  push:
    branches: [week-05]
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool install --global dotnet-ef --version "10.0.*"
      - run: dotnet build Magpie.slnx 2>&1 | grep -E "error|Build succeeded" | sort -u | head -40
      - name: Check that the starter sources answer (one polite request each, once)
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          text = re.sub(r'^\s*//.*$', '', open('infra/seed/sources.json').read(), flags=re.M)
          for s in json.loads(text):
              try:
                  req = urllib.request.Request(s['address'], headers={'User-Agent': 'MagpieCollector/0.1 (+https://github.com/ankitchoubey800/magpie) one-time seed check'})
                  r = urllib.request.urlopen(req, timeout=20); body = r.read(300000)
                  root = re.search(rb'<(rss|feed)[\s>]', body)
                  print('SEEDCHECK', r.status, (root.group(1).decode() if root else body[:20].decode('utf8','replace')), len(body), s['address'])
              except Exception as e:
                  print('SEEDCHECK FAIL', repr(e)[:120], s['address'])
          PY
      - name: Create migration
        env:
          ConnectionStrings__CollectorDb: "Host=localhost;Database=design_time_only"
          Collector__ContactUrl: "https://example.com"
        run: |
          dotnet ef migrations add InitialCollector \
            --project src/services/collector/Magpie.Collector.Infrastructure \
            --startup-project src/services/collector/Magpie.Collector.Worker \
            --output-dir Persistence/Migrations
          echo "MIGRATION_TAR_BEGIN"
          tar czf - -C src/services/collector/Magpie.Collector.Infrastructure Persistence/Migrations | base64 -w0
          echo
          echo "MIGRATION_TAR_END"
